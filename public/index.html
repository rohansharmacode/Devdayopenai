<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <title>RotaBuddy</title>
  <link rel="preload" href="/vendor/geist/geist-sans/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/fullcalendar/index.global.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong>RotaBuddy</strong>
      <span class="sep">/</span>
      <small id="siteName"></small>
    </div>
    <label class="who">
      <span>Viewing as</span>
      <select id="whoSelect" aria-label="Viewing as"></select>
    </label>
  </header>

  <div id="managerView" class="page" hidden>
    <div class="page-head">
      <div>
        <h1>Rota</h1>
        <p id="weekLabel"></p>
      </div>
      <span id="aiBadge"></span>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="layout">
      <section>
        <div class="card" id="attentionCard" hidden>
          <h2>Needs attention</h2>
          <ul class="attention" id="alerts"></ul>
        </div>
        <div class="card cal-card"><div id="calendar"></div></div>
        <p class="hint">Drag across empty time to add a shift. Click a shift to edit it or find cover.</p>
      </section>
      <aside>
        <div class="card">
          <div class="card-head">
            <h2>Pay</h2>
            <div class="seg" data-pay-toggle>
              <button data-period="week" class="on">Week</button>
              <button data-period="month">Month</button>
            </div>
          </div>
          <div id="payTable"></div>
          <div style="margin-top:12px"><button id="csvLink" class="link">Export CSV</button></div>
        </div>
        <div class="card">
          <h2>Time off</h2>
          <div id="timeOffList"></div>
        </div>
        <div class="card">
          <h2>Activity</h2>
          <ul id="activity" class="activity"></ul>
          <button id="resetBtn" class="link">Reset demo data</button>
        </div>
      </aside>
    </div>
  </div>

  <main id="workerView" class="worker" hidden>
    <div class="greeting">
      <h1 id="greeting"></h1>
      <p id="greetingSub"></p>
    </div>
    <div class="card clock-card" id="clockCard"></div>
    <div id="coverAsks"></div>
    <div class="card">
      <div class="card-head">
        <h2>Pay</h2>
        <div class="seg" data-pay-toggle>
          <button data-period="week" class="on">Week</button>
          <button data-period="month">Month</button>
        </div>
      </div>
      <div id="myPay"></div>
    </div>
    <div class="card">
      <h2>Upcoming</h2>
      <ul id="myShifts" class="shift-list"></ul>
    </div>
    <div class="card">
      <h2>Rota</h2>
      <div id="myCalendar"></div>
    </div>
    <div class="card">
      <h2>Time off</h2>
      <form id="timeOffForm" class="form-grid">
        <label>From <input type="date" name="start" required /></label>
        <label>To <input type="date" name="end" required /></label>
        <label class="wide">Reason (optional) <input name="reason" maxlength="200" placeholder="Holiday, appointment…" /></label>
        <button class="btn wide">Request time off</button>
      </form>
      <ul id="myTimeOff" class="plain" style="margin-top:12px"></ul>
    </div>
  </main>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
